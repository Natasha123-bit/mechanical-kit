    .c-violet { stroke: #a78bfa; fill: rgba(167,139,250,0.12); }
    .c-rose   { stroke: #fb7185; fill: rgba(251,113,133,0.12); }
    .c-cyan   { stroke: #22d3ee; fill: rgba(34,211,238,0.12); }
