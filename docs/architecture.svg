    .bn { font-size: 13px; fill: #94a3b8; }
    .fl { font-size: 12.5px; fill: #94a3b8; }
    .d1 { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .d2 { font-size: 13px; fill: #cbd5e1; }
